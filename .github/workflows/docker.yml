name: Build and Push Docker Image

on:
  push:
    branches:
      - master
      - dev/dev
      - release
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: registry.cn-chengdu.aliyuncs.com
  IMAGE_NAME: doomer/inter-info

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/master' }}
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value={{date 'YYYYMMDDHHmmss' tz='Asia/Shanghai'}},enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/dev/dev' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/release' }}
            type=semver,pattern={{version}}

      - name: Build and push image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger redeploy webhook
        if: steps.build-and-push.outcome == 'success'
        env:
          # master 推送独立的重新部署 webhook；REDEPLOY_WEBHOOK_URL_MASTER 暂未配置时回退到原变量。
          WEBHOOK_URL: ${{ github.ref == 'refs/heads/master' && secrets.REDEPLOY_WEBHOOK_URL_MASTER || secrets.REDEPLOY_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          payload=$(printf '{"triggered_by":"github-actions","repository":"%s","branch":"%s","commit":"%s","timestamp":"%s"}' "$REPOSITORY" "$BRANCH" "$COMMIT" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')")
          curl -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$payload" || echo "Webhook call failed, but build succeeded"
