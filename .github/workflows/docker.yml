name: Build and Push Docker Image

on:
  push:
    branches:
      - master
      - dev/dev
      - release
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: registry.cn-chengdu.aliyuncs.com
  IMAGE_NAME: doomer/inter-info

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev/dev' }}
            type=semver,pattern={{version}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger redeploy webhook
        if: steps.build-and-push.outcome == 'success'
        run: |
          curl -X POST ${{ secrets.REDEPLOY_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d '{
              "triggered_by": "github-actions",
              "repository": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}",
              "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            }' || echo "Webhook call failed, but build succeeded"